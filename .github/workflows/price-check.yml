name: Price Check

on:
  schedule:
    # Runs every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  check-price:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed so the workflow can commit the updated state file
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python price_alert.py

      - name: Save updated price state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/last_price.json
          git diff --staged --quiet || git commit -m "Update recorded price [skip ci]"
          git push
